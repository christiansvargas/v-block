<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>v-block</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <img
        class="logo"
        src="../assets/logo.png"
        alt=""
        width="42"
        height="42"
      />
      <div>
        <h1>v-block</h1>
        <p>Less interruption.</p>
      </div>
    </header>
    <main>
      <label
        ><span>Enable on YouTube<small>Network and page filtering</small></span
        ><input id="enabled" type="checkbox" disabled
      /></label>
      <label
        ><span
          >Skip video ads<small>Experimental · skip, mute, seek</small></span
        ><input id="skipVideoAds" type="checkbox" disabled
      /></label>
      <p id="status" role="status" aria-live="polite">Loading settings…</p>
      <p class="note">
        Refresh YouTube after installation. Some video ads may still play. Turn
        off video skipping if playback behaves unexpectedly.
      </p>
    </main>
    <footer>LOCAL ONLY <span>0.2.0</span></footer>
    <script src="script.js"></script>
  </body>
</html>
